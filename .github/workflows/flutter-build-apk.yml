name: Build and Publish Flutter Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Flutter Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_shopgenie
        run: flutter pub get

      - name: Build debug APK
        working-directory: flutter_shopgenie
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopgenie-customer-debug-apk
          path: flutter_shopgenie/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$tag" \
            flutter_shopgenie/build/app/outputs/flutter-apk/app-debug.apk \
            --title "Flutter Debug APK Build #${{ github.run_number }}" \
            --notes "Automatically built Flutter Android debug APK for testing." \
            --target "${{ github.sha }}" \
            --latest
